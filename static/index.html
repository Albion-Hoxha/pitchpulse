<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PitchPulse</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="pulse-dot" aria-hidden="true"></span>PitchPulse <small>AI Broadcast Director</small></div>
    <div class="controls">
      <button id="play" type="button">▶ Kick off</button>
      <label>Speed
        <select id="speed">
          <option value="10">10×</option>
          <option value="30" selected>30×</option>
          <option value="60">60×</option>
          <option value="200">200×</option>
        </select>
      </label>
      <label>Match <input id="seed" type="number" value="7" min="0" step="1"></label>
      <label>Viewer
        <select id="mode">
          <option value="casual" selected>Casual fan</option>
          <option value="analyst">Analyst</option>
        </select>
      </label>
      <label>Supporting
        <select id="favorite">
          <option value="">Neutral</option>
          <option value="home" id="fav-home">Home</option>
          <option value="away" id="fav-away">Away</option>
        </select>
      </label>
      <label>Follow player
        <select id="player">
          <option value="">Nobody</option>
        </select>
      </label>
      <label>Language
        <select id="language">
          <option>English</option>
          <option>Albanian</option>
          <option>Spanish</option>
          <option>French</option>
          <option>German</option>
          <option>Portuguese</option>
          <option>Arabic</option>
        </select>
      </label>
    </div>
  </header>

  <main class="layout">
    <section class="screen" aria-label="Live match feed">
      <div class="scorebug" aria-live="polite">
        <span class="team home"><i></i><b id="home-short">NOR</b></span>
        <span class="score"><b id="home-goals">0</b>–<b id="away-goals">0</b></span>
        <span class="team away"><b id="away-short">RIV</b><i></i></span>
        <span class="clock" id="clock">0:00</span>
      </div>

      <svg id="pitch" viewBox="-4 -4 113 76" role="img" aria-label="Pitch with ball position">
        <rect x="-4" y="-4" width="113" height="76" class="grass"/>
        <g class="lines">
          <rect x="0" y="0" width="105" height="68"/>
          <line x1="52.5" y1="0" x2="52.5" y2="68"/>
          <circle cx="52.5" cy="34" r="9.15"/>
          <rect x="0" y="13.84" width="16.5" height="40.32"/>
          <rect x="88.5" y="13.84" width="16.5" height="40.32"/>
          <rect x="0" y="24.84" width="5.5" height="18.32"/>
          <rect x="99.5" y="24.84" width="5.5" height="18.32"/>
          <rect x="-2" y="30.34" width="2" height="7.32"/>
          <rect x="105" y="30.34" width="2" height="7.32"/>
        </g>
        <g id="trail"></g>
        <circle id="ball" cx="52.5" cy="34" r="1.1"/>
      </svg>

      <div class="momentum" aria-label="Momentum, last 5 minutes">
        <span>Momentum</span>
        <div class="momentum-track"><div id="momentum-bar"></div></div>
      </div>

      <div id="player-cam" class="player-cam" hidden aria-live="polite"></div>

      <div id="graphic" class="graphic" hidden aria-live="polite"></div>

      <div id="lower-third" class="lower-third" aria-live="assertive" hidden>
        <span class="lt-kind" id="lt-kind"></span>
        <span class="lt-text" id="lt-text"></span>
      </div>
    </section>

    <aside class="panel">
      <h2>Live stats</h2>
      <div class="legend"><span class="home" id="home-name">Home</span><span class="away" id="away-name">Away</span></div>
      <div id="stats"></div>
      <section id="recap-box" hidden>
        <h2>Match recap</h2>
        <p id="recap" class="recap"></p>
      </section>
      <h2>Key moments</h2>
      <ol id="moments" class="moments"></ol>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
