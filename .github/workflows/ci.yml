name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # No Azure secrets here: the agents fall back to templates, everything else is tested for real.
      - run: python -m unittest discover tests -v
      - name: Docker image builds
        run: docker build -t pitchpulse .
